<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21 Questions</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: black;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .card-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 3/4;
            background-color: #1a1a1a;
            border-radius: 1.5rem;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #a855f7;
            cursor: pointer;
            text-align: center;
        }

        .question {
            font-size: 1.5rem;
            font-weight: 500;
        }

        .bottom-spacer {
            height: 2rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <i data-lucide="chevron-left" class="icon"></i>
        <span class="title">21 QUESTIONS™</span>
        <i data-lucide="rotate-ccw" class="icon" id="resetBtn"></i>
    </div>

    <div class="card-container">
        <div class="card" id="questionCard">
            <div class="question" id="questionText"></div>
        </div>
    </div>

    <div class="bottom-spacer"></div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Questions array
        const questions = [
            "If you could gather a small group of people for a fun day, who would be there?",
            "If you could build a perfect menu, what three dishes would be on it?",
            "If someone threw you a surprise party, what theme or vibe would you secretly love?",
            "What type of present do you love more: something practical or something sentimental?",
            "What's something exciting you want to accomplish or try this year?"
        ];

        let currentIndex = 0;
        const questionText = document.getElementById('questionText');
        const questionCard = document.getElementById('questionCard');
        const resetBtn = document.getElementById('resetBtn');

        // Display initial question
        questionText.textContent = questions[currentIndex];

        // Next question on card click
        questionCard.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % questions.length;
            questionText.textContent = questions[currentIndex];
        });

        // Reset questions
        resetBtn.addEventListener('click', () => {
            currentIndex = 0;
            questionText.textContent = questions[currentIndex];
        });
    </script>
</body>
</html>
