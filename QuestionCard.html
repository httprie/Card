<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameCards</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #d5e3f8, #f8d5e5, #e8e8e8);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .header {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #555;
        }

        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            width: 300px;
            height: 400px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

            .card-container:hover {
                transform: translateY(-5px);
                box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
            }

        .card-text {
            font-size: 18px;
            color: #444;
            padding: 20px;
            display: none;
        }

            .card-text.active {
                display: block;
            }
    </style>
</head>
<body>
    <div class="header">GameCards</div>
    <div id="card" class="card-container" onclick="showNextCard()">
        <div id="cardText" class="card-text active">If you could gather a small group of people for a fun day, who would be there?</div>
    </div>

    <script>
        const questions = [
            "If you could gather a small group of people for a fun day, who would be there?",
            "If you could build a perfect menu, what three dishes would be on it?",
            "If someone threw you a surprise party, what theme or vibe would you secretly love?",
            "What type of present do you love more: something practical or something sentimental?",
            "What’s something exciting you want to accomplish or try this year?"
        ];

        let currentIndex = 0;

        function showNextCard() {
            currentIndex = (currentIndex + 1) % questions.length;
            const cardText = document.getElementById("cardText");
            cardText.classList.remove("active");

            setTimeout(() => {
                cardText.innerText = questions[currentIndex];
                cardText.classList.add("active");
            }, 300);
        }
    </script>
</body>
</html>
